<svg width="620" height="200" viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .ninja { animation: walk 7s ease-in-out infinite; }
    @keyframes walk {
      0%    { transform: translateX(30px); }
      22%   { transform: translateX(140px); }
      42%   { transform: translateX(280px); }
      70%   { transform: translateX(280px); }
      84%   { transform: translateX(30px); }
      100%  { transform: translateX(30px); }
    }
    .leg-l { animation: ll 0.55s ease-in-out infinite alternate; transform-origin: 13px 128px; }
    .leg-r { animation: lr 0.55s ease-in-out infinite alternate; transform-origin: 27px 128px; }
    @keyframes ll { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
    @keyframes lr { from { transform: rotate(6deg); } to { transform: rotate(-6deg); } }
    .arm-l { animation: al 0.55s ease-in-out infinite alternate; transform-origin: 5px 99px; }
    .arm-r { animation: ar 0.55s ease-in-out infinite alternate; transform-origin: 36px 99px; }
    @keyframes al { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
    @keyframes ar { from { transform: rotate(4deg); } to { transform: rotate(-4deg); } }
    .lupa-grp { animation: lupaAnim 7s ease-in-out infinite; }
    @keyframes lupaAnim {
      0%,20%  { opacity:1; transform: translateY(0); }
      27%     { opacity:0; transform: translateY(20px); }
      100%    { opacity:0; transform: translateY(20px); }
    }
    .lupa-floor { animation: lupaFloor 7s ease-in-out infinite; }
    @keyframes lupaFloor {
      0%,26%  { opacity:0; }
      28%     { opacity:0.55; }
      72%     { opacity:0.55; }
      78%     { opacity:0; }
      100%    { opacity:0; }
    }
    .sword-l { animation: sl 7s ease-in-out infinite; transform-origin: 10px 116px; }
    @keyframes sl {
      0%,25%   { opacity:0; transform: rotate(0deg); }
      29%      { opacity:1; transform: rotate(-25deg); }
      42%      { opacity:1; transform: rotate(-30deg); }
      45%      { opacity:1; transform: rotate(98deg); }
      48%      { opacity:1; transform: rotate(-20deg); }
      51%      { opacity:1; transform: rotate(95deg); }
      54%      { opacity:1; transform: rotate(-18deg); }
      57%      { opacity:1; transform: rotate(100deg); }
      60%      { opacity:1; transform: rotate(-22deg); }
      63%      { opacity:1; transform: rotate(105deg); }
      67%      { opacity:1; transform: rotate(40deg); }
      70%      { opacity:1; transform: rotate(40deg); }
      79%      { opacity:0; }
      100%     { opacity:0; transform: rotate(0deg); }
    }
    .sword-r { animation: sr 7s ease-in-out infinite; transform-origin: 30px 116px; }
    @keyframes sr {
      0%,25%   { opacity:0; transform: rotate(0deg); }
      29%      { opacity:1; transform: rotate(25deg); }
      42%      { opacity:1; transform: rotate(30deg); }
      45%      { opacity:1; transform: rotate(30deg); }
      48%      { opacity:1; transform: rotate(82deg); }
      51%      { opacity:1; transform: rotate(28deg); }
      54%      { opacity:1; transform: rotate(80deg); }
      57%      { opacity:1; transform: rotate(25deg); }
      60%      { opacity:1; transform: rotate(86deg); }
      63%      { opacity:1; transform: rotate(28deg); }
      66%      { opacity:1; transform: rotate(90deg); }
      70%      { opacity:1; transform: rotate(42deg); }
      79%      { opacity:0; }
      100%     { opacity:0; transform: rotate(0deg); }
    }
    .slash1 { animation: s1 7s ease-in-out infinite; }
    .slash2 { animation: s2 7s ease-in-out infinite; }
    .slash3 { animation: s3 7s ease-in-out infinite; }
    .slash4 { animation: s4 7s ease-in-out infinite; }
    @keyframes s1 { 0%,43.5%,47.5% { opacity:0; } 45% { opacity:1; } 47% { opacity:0; } 100% { opacity:0; } }
    @keyframes s2 { 0%,47.5%,51.5% { opacity:0; } 49% { opacity:1; } 51% { opacity:0; } 100% { opacity:0; } }
    @keyframes s3 { 0%,53%,57%     { opacity:0; } 55% { opacity:1; } 56.5% { opacity:0; } 100% { opacity:0; } }
    @keyframes s4 { 0%,62%,67%     { opacity:0; } 64% { opacity:1; } 66%   { opacity:0; } 100% { opacity:0; } }
    .sp1 { animation: sp1a 7s infinite; }
    .sp2 { animation: sp2a 7s infinite; }
    .sp3 { animation: sp3a 7s infinite; }
    .sp4 { animation: sp4a 7s infinite; }
    @keyframes sp1a { 0%,44%,47.5% { opacity:0; } 45.5% { opacity:1; } 47% { opacity:0; } 100% { opacity:0; } }
    @keyframes sp2a { 0%,48%,52%   { opacity:0; } 49.5% { opacity:1; } 51% { opacity:0; } 100% { opacity:0; } }
    @keyframes sp3a { 0%,53.5%,57% { opacity:0; } 55%   { opacity:1; } 57% { opacity:0; } 100% { opacity:0; } }
    @keyframes sp4a { 0%,62.5%,67% { opacity:0; } 64%   { opacity:1; } 66% { opacity:0; } 100% { opacity:0; } }
    .bug { animation: bugAnim 7s ease-in-out infinite; transform-origin: 370px 125px; }
    @keyframes bugAnim {
      0%,43%   { opacity:1; transform: scale(1) rotate(0deg); }
      45%      { transform: scale(0.85) rotate(-12deg); }
      48%      { transform: scale(1.1) rotate(10deg); }
      51%      { transform: scale(0.85) rotate(-10deg); }
      54%      { transform: scale(1.1) rotate(12deg); }
      57%      { transform: scale(0.85) rotate(-8deg); }
      60%      { transform: scale(1.1) rotate(8deg); }
      64%      { transform: scale(1.4); opacity:1; }
      68%      { transform: scale(0) rotate(720deg); opacity:0; }
      82%      { opacity:0; transform:scale(0); }
      84%      { opacity:1; transform:scale(1); }
      100%     { opacity:1; transform:scale(1); }
    }
    .eyes { animation: eyeBlink 4s infinite; transform-origin: 50% 50%; }
    @keyframes eyeBlink {
      0%,87%,93%,100% { transform: scaleY(1); }
      90% { transform: scaleY(0.07); }
    }
  </style>
</defs>
